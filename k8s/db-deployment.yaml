apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
  namespace: car-parking
  labels:
    app: car-parking-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: car-parking-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: car-parking-db
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.4
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: MYSQL_DATABASE
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/mysql
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: db-pvc
      - name: init-script
        configMap:
          name: db-init-configmap
