services:
  web:
    build: .
    container_name: car_parking_web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=parkingdb
      - DB_PORT=3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - parking_net

  db:
    image: mariadb:10.4
    container_name: car_parking_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: parkingdb
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - parking_net

networks:
  parking_net:
    driver: bridge

volumes:
  db_data:
